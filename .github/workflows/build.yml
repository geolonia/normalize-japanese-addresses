# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: build

on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: "ビルド・リント"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master'
        with:
          path: demo

  deploy-pages:
    name: "GitHub Pages へのデプロイ"
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  test:
    name: "テスト"
    needs:
      - build

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - run: npm ci
      - run: npm test

      # 結合テストはビルドされたものが必要
      # また、Node.js 18.x では結合テストをスキップする
      # Node.js 26.x もスキップする。puppeteer 23.6.0 が使う extract-zip@2.0.1 が
      # Node.js 26 で zip 展開を無音で中断し Chrome が用意されないため
      # （puppeteer#14957）。修正済みの puppeteer 25.x は node >=22.12.0 を要求し
      # 20.x の結合テストが回せなくなるため、この PR では追従しない
      - name: 結合テスト
        if: matrix.node-version != '18.x' && matrix.node-version != '26.x'
        run: npm run test:integration

  # アドレステストは時間かかるし、環境依存が無いので、matrixにいれる必要無い
  test-addresses:
    name: "詳細住所テスト"
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:addresses

  publish:
    name: 'npm 公開'
    runs-on: ubuntu-latest
    needs:
      - test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v7
        with:
          # Node.js 24.x が同梱する npm は、OIDC 公開に必要な 11.5.1 以降を満たす
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@geolonia'
          package-manager-cache: false

      # 公開されるバージョンは package.json 由来、dist-tag の判定はタグ名由来のため、
      # 両者がずれていると意図しない dist-tag で公開される。公開前に落とす。
      - name: タグを検証して公開メタデータを決める
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::タグ $TAG が package.json の version $PKG と一致しません"
            exit 1
          fi
          # ${TAG%%+*} でビルドメタデータを落とす。その中のハイフンは prerelease ではない。
          case "${TAG%%+*}" in *-*) PRERELEASE=1 ;; *) PRERELEASE=0 ;; esac
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build

      # prerelease は next dist-tag に公開し、npm install の既定や ^/~ の範囲に入れない
      - name: 公開 (latest)
        if: steps.meta.outputs.prerelease == '0'
        run: npm publish --access=public --provenance
      - name: 公開 (next)
        if: steps.meta.outputs.prerelease == '1'
        run: npm publish --access=public --provenance --tag=next
